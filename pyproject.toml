[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algovision"
version = "0.1.0"
description = "Visual chart-pattern detection and scanning for US stocks (S&P 500 / NASDAQ-100)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "requests>=2.28",
    "lxml>=4.9",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]
dev = ["pytest>=7"]

[project.scripts]
algovision = "algovision.cli:main"

[tool.setuptools.packages.find]
include = ["algovision*"]

[tool.setuptools.package-data]
"algovision.data" = ["universe_snapshot.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
